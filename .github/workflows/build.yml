name: Build IdeaCentre Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev libelf-dev bc cpio debhelper git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler

      - name: Clone Custom IdeaCentre Repository
        run: |
          git clone https://github.com/markovicaleksandar/linux_ideacentre_01Q8X10.git repo

      - name: List Repository Contents & Run Script
        run: |
          cd repo
          ls -la
          chmod +x *.sh || true
          
          # Find any .sh script in the directory and run the first one found
          SCRIPT=$(ls *.sh 2>/dev/null | head -n 1)
          if [ -n "$SCRIPT" ]; then
            echo "Executing script: $SCRIPT"
            ./"$SCRIPT"
          else
            echo "No shell script found! Checking repository structure..."
            exit 1
          fi

      - name: Upload Compiled Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-and-dtb
          path: |
            repo/**/*.dtb
            repo/**/*.deb
            repo/**/*.bin
            *.deb
