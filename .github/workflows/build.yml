name: Build IdeaCentre Custom Kernel Loose Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev libelf-dev bc cpio debhelper git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler kmod libmnl-dev

      - name: Clone Custom IdeaCentre Repository
        run: |
          git clone https://github.com repo

      - name: Patch Configuration
        run: |
          cd repo
          chmod +x *.sh
          ./fix-kernel-config.sh || true

      - name: Force Direct Architecture Kernel Compilation
        run: |
          cd repo/linux
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          # Explicitly compiles the loose uncompressed Image file and the dtbs map
          make -j$(nproc) Image dtbs
          
          # Move the loose binaries to a clean staging root folder for direct recovery
          cp arch/arm64/boot/Image ../../lenovo_working_kernel.bin
          cp arch/arm64/boot/dts/qcom/hamoa-lenovo-ideacentre-mini-01q8x10.dtb ../../lenovo_ideacentre.dtb

      - name: Package Raw Files for Direct USB Injection
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-and-dtb
          path: |
            lenovo_working_kernel.bin
            lenovo_ideacentre.dtb
