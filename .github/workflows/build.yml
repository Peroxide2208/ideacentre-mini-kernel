name: Build IdeaCentre Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev libelf-dev bc cpio debhelper git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler

      - name: Clone Custom Repository
        run: |
          git clone https://github.com/markovicaleksandar/linux_ideacentre_01Q8X10.git repo

      - name: Run Build Script
        run: |
          cd repo
          chmod +x *.sh || true
          if [ -f "build.sh" ]; then
            ./build.sh
          elif [ -f "make.sh" ]; then
            ./make.sh
          else
            echo "Running direct build commands..."
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
            make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg
          fi

      - name: Upload Compiled Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-and-dtb
          path: |
            repo/**/*.dtb
            repo/**/*.deb
            *.deb
